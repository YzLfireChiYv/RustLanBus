[package]
name = "rustlanbus-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
arc-swap = "=1.9.2"
base64 = "0.23.1"
httparse = "1.10.1"
if-addrs = "=0.15.0"
mdns-sd = { version = "=0.21.6", default-features = false }
mio = { version = "=1.2.3", default-features = false, features = ["os-poll", "net"] }
rand = "0.10.2"
rlb-audio.workspace = true
rlb-audio-windows.workspace = true
rlb-clock.workspace = true
rlb-codec.workspace = true
rlb-control.workspace = true
rlb-contact = { workspace = true, features = ["mdns"] }
rlb-jitter.workspace = true
rlb-media.workspace = true
rlb-model.workspace = true
rlb-net.workspace = true
rlb-peer.workspace = true
rlb-registry.workspace = true
rlb-session.workspace = true
rubato = { version = "=5.0.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.6"
socket2 = "=0.6.5"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Console", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_NetworkManagement_WindowsFirewall", "Win32_Networking_WinSock"] }

[build-dependencies]
embed-resource = "=3.0.11"

[lints]
workspace = true
